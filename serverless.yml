service: uaipy-core

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, "local"}
  environment: ${file(./config/environments/env.${self:provider.stage}.json)}
  apiGateway:
    apiKeys:
      - device:
          - deviceApiKey
      - client:
          - clientApiKey
    usagePlan:
      - device:
          quota:
            limit: 50000
            offset: 2
            period: MONTH
          throttle:
            burstLimit: 2000
            rateLimit: 1000
      - client:
          quota:
            limit: 50000
            offset: 2
            period: MONTH
          throttle:
            burstLimit: 2000
            rateLimit: 1000
      - heroku:
          quota:
            limit: 50000
            offset: 2
            period: MONTH
          throttle:
            burstLimit: 2000
            rateLimit: 1000
  iam:
    role: 
      statements:
        # SQS
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: 
            - !GetAtt GenerateReportQueue.Arn
            - !GetAtt PersistMessageQueue.Arn
        # S3
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:AbortMultipartUpload
            - s3:GetObject
          Resource:
            - !GetAtt ReportsBucket.Arn
            - !Join ['/', [!GetAtt ReportsBucket.Arn, '*']]
plugins:
  - serverless-plugin-typescript
  - serverless-offline
package:
  individually: true
build:
  esbuild: false
  exclude:
      - '@aws-sdk/*'

functions:
  getUsersFunction:
    handler: src/infra/functions/user/getUsersFunction.handler

  createUserFunction:
    handler: src/infra/functions/user/createUserFunction.handler
    events:
      - http:
          path: user
          method: POST
          private: true
          cors: true

  helloFunction:
    handler: src/infra/functions/helloFunction.handler
    events:
      - http:
          private: true
          path: hello
          method: GET
          cors: true
          
  userAuthFunction:
    handler: src/infra/functions/auth/userAuthFunction.handler
    events:
      - http:
          path: user/auth
          method: POST
          private: true
          cors: true

  orquestratorAuthFunction:
    handler: src/infra/functions/auth/orquestratorAuthFunction.handler
    events:
      - http:
          path: orquestrator/auth
          method: POST
          private: true
          cors: true

  createOrquestratorFunction:
    handler: src/infra/functions/orquestrator/createOrquestratorFunction.handler
    events:
      - http:
          path: orquestrator
          method: POST
          private: true
          cors: true

  generatePersistMessageFunction:
    handler: src/infra/functions/http/message/generatePersistMessageFunction.handler
    events:
      - http:
          path: message/persist
          method: POST
          private: true

  processPersistMessageQueue:
    handler: src/infra/functions/queue/persistMessageQueueFunction.handler
    timeout: 180
    memorySize: 512
    events:
      - sqs:
          arn: !GetAtt PersistMessageQueue.Arn
          batchSize: 1

  generateProcessReportFunction:
    handler: src/infra/functions/http/message/generateProcessReportFunction.handler
    events:
      - http:
          path: message/process
          method: POST
          private: true

  processProcessReportQueue:
    handler: src/infra/functions/queue/processReportQueueFunction.handler
    timeout: 180
    memorySize: 512
    events:
      - sqs:
          arn: !GetAtt GenerateReportQueue.Arn
          batchSize: 1


resources:
  - ${file(resources/sqs/PersistMessageQueue.yml)}
  - ${file(./resources/sqs/GenerateReportQueue.yml)}
  - ${file(./resources/s3/ReportsBucket.yml)}