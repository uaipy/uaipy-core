Resources:
  PersistMessageQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: PersistMessageQueue
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PersistMessageQueueDLQ.Arn
        maxReceiveCount: 3
  PersistMessageQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: PersistMessageQueueDLQ
      MessageRetentionPeriod: 1209600 # 14 days
